name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Layout: scope -> (test | build+browser checks) -> check.
# Unit tests run beside the build instead of before it. Smoke and snapshots stay in the build job:
# splitting them into their own jobs was measured slower (repeated setup), see docs/refinement-backlog.md CI1. "check" is the only required status: it aggregates everything, so add or rename
# jobs freely as long as they stay in check's `needs`.
jobs:
  # Docs/notes-only changes (*.md, docs/) cannot affect the app, so every heavy job is skipped.
  # pull_request checks out the merge commit, so HEAD^1 is main and the diff is exactly this PR's changes.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        run: |
          files=$(git diff --name-only HEAD^1 HEAD || true)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '(^docs/|\.md$)'; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: skipping build and browser jobs."
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Builds the app once and hands dist/ to the browser jobs below as an artifact, so each of them skips the build.
  build:
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Self-hosted embedding model: cache it so the build doesn't re-download from Hugging Face.
      - uses: actions/cache@v4
        with:
          path: public/models
          key: model-${{ hashFiles('src/scorer/model.js') }}
      # prebuild tries to self-host the embedding model and skips gracefully if the network blocks it.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist/
          retention-days: 1

  # The browser guards, sharded: every guard in a shard runs at once on its own runner, and no shard runs more than three
  # browsers together, so each guard has headroom (a crowded runner timed out guards that pass alone). Each shard serves
  # the built app from the artifact. Add a guard to the shard that has room, or to a new shard.
  guards:
    needs: [scope, build]
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            scripts: smoke snapshots text-fit
          - shard: 2
            scripts: transitions room-switch room-visuals
          - shard: 3
            scripts: ra-fixes ember-log home-frames
          - shard: 4
            scripts: stamps-look almanac-progress patrons
          - shard: 5
            scripts: pwa-check review-shelf first-note-clear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: dist
      - name: Get Playwright version
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      # Each script serves dist/ on its own random port, so the shard's scripts run side by side.
      - name: Browser guards (this shard, in parallel)
        run: |
          rc=0; pids=""
          for s in ${{ matrix.scripts }}; do node scripts/$s.mjs & pids="$pids $!"; done
          for p in $pids; do wait $p || rc=1; done
          exit $rc
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-${{ matrix.shard }}
          path: snapshot-diffs/
          if-no-files-found: ignore

  # Alone on its runner, so timings mean something: the budgets are generous (see the scripts) and catch a data-wait,
  # judge or memory regression in kind.
  perf:
    needs: [scope, build]
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: dist
      - name: Get Playwright version
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Performance budget (repeat visit on a slow data network, judge latency, entry weight)
        run: node scripts/perf-budget.mjs --rooms hall,science,body
      # Memory and frame time: heap after the judge warms (its data lives in a worker), heap/DOM/listeners kept across laps of
      # every room and a long Unlimited run, and the worst frozen frame of a throttled room walk. Leaves traces on failure.
      - name: Memory and frame-time budget (leaks across room laps and long runs, worst frame)
        run: node scripts/perf-memory.mjs
      - name: Upload performance traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-traces
          path: perf-traces/
          if-no-files-found: ignore

  # The single required status check: name it "check" in branch protection / rulesets.
  # Runs even when upstream jobs fail or are skipped; passes only if none failed or were cancelled
  # (skipped is fine: that is the docs-only path).
  check:
    if: always()
    needs: [scope, test, build, guards, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed."; exit 1
          fi
