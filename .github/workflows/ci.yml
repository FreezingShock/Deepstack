name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Layout: scope -> (test | build+browser checks) -> check.
# Unit tests run beside the build instead of before it. Smoke and snapshots stay in the build job:
# splitting them into their own jobs was measured slower (repeated setup), see docs/refinement-backlog.md CI1. "check" is the only required status: it aggregates everything, so add or rename
# jobs freely as long as they stay in check's `needs`.
jobs:
  # Docs/notes-only changes (*.md, docs/) cannot affect the app, so every heavy job is skipped.
  # pull_request checks out the merge commit, so HEAD^1 is main and the diff is exactly this PR's changes.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        run: |
          files=$(git diff --name-only HEAD^1 HEAD || true)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '(^docs/|\.md$)'; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: skipping build and browser jobs."
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Self-hosted embedding model: cache it so the build doesn't re-download from Hugging Face.
      - uses: actions/cache@v4
        with:
          path: public/models
          key: model-${{ hashFiles('src/scorer/model.js') }}
      # prebuild tries to self-host the embedding model and skips gracefully if the network blocks it.
      - run: npm run build
      - name: Get Playwright version
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      # Both scripts serve the build on their own random port, so they run side by side.
      - name: Smoke test and screenshot snapshots (in parallel)
        run: |
          node scripts/smoke.mjs & smoke=$!
          node scripts/snapshots.mjs & snaps=$!
          node scripts/text-fit.mjs & fit=$!
          node scripts/transitions.mjs & trans=$!
          node scripts/room-switch.mjs & rooms=$!
          node scripts/room-visuals.mjs & rvis=$!
          node scripts/ra-fixes.mjs & rafix=$!
          node scripts/ember-log.mjs & ember=$!
          node scripts/stamps-look.mjs & stamps=$!
          node scripts/pwa-check.mjs & pwa=$!
          node scripts/restore-check.mjs & rest=$!
          node scripts/review-shelf.mjs & review=$!
          rc=0
          wait $smoke || rc=1
          wait $snaps || rc=1
          wait $fit || rc=1
          wait $trans || rc=1
          wait $rooms || rc=1
          wait $rvis || rc=1
          wait $rafix || rc=1
          wait $ember || rc=1
          wait $stamps || rc=1
          wait $pwa || rc=1
          wait $review || rc=1
          wait $rest || rc=1
          node scripts/first-note-clear.mjs || rc=1
          exit $rc
      # Alone on the runner: their 15 s and 5 s waits time out beside the twelve other browsers in the batch (they pass alone).
      - name: Timing-sensitive guards (run alone after the batch)
        run: |
          node scripts/home-frames.mjs
          node scripts/almanac-progress.mjs
          node scripts/patrons.mjs
          node scripts/a11y-axe.mjs
          node scripts/a11y-focus.mjs
      # Alone on the runner: timings are meaningless next to seven other browsers. Budgets are generous (see the script); it catches a data-wait or judge regression in kind.
      - name: Performance budget (repeat visit on a slow data network, judge latency, entry weight)
        run: node scripts/perf-budget.mjs --rooms hall,science,body
      # Input to next paint at 4x CPU: room switch, settings book, answer submit (desktop and phone), plus the rule that a room's save runs after its first painted frame.
      - name: Input latency budget (room switch, book open, submit at 4x CPU)
        run: node scripts/latency-budget.mjs
      # Memory and frame time: heap after the judge warms (its data lives in a worker), heap/DOM/listeners kept across laps of
      # every room and a long Unlimited run, and the worst frozen frame of a throttled room walk. Leaves traces on failure.
      - name: Memory and frame-time budget (leaks across room laps and long runs, worst frame)
        run: node scripts/perf-memory.mjs
      - name: Upload performance traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-traces
          path: perf-traces/
          if-no-files-found: ignore
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: snapshot-diffs/
          if-no-files-found: ignore

  # The single required status check: name it "check" in branch protection / rulesets.
  # Runs even when upstream jobs fail or are skipped; passes only if none failed or were cancelled
  # (skipped is fine: that is the docs-only path).
  check:
    if: always()
    needs: [scope, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed."; exit 1
          fi
